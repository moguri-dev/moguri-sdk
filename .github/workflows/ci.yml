name: CI
on:
  push:
    branches: [main]
permissions:
  contents: read
# One group per commit: a later push to main must not cancel another commit's verification.
concurrency:
  group: ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      # The lean file tools run ripgrep, and the native dependency cache tests run real Go, Cargo and pip.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: false
      - name: Install ripgrep and a standalone Cargo
        run: |
          tools="$RUNNER_TEMP/native-tools"; mkdir -p "$tools"
          if [ "$RUNNER_OS" = macOS ]; then
            brew install ripgrep rust; rust="$(brew --prefix rust)/bin"
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep cargo; rust=/usr/bin
          fi
          # The native cache runs Cargo with a private HOME, where the runner's rustup proxies find no toolchain.
          ln -s "$rust/cargo" "$tools/cargo"; ln -s "$rust/rustc" "$tools/rustc"
          echo "$tools" >> "$GITHUB_PATH"
          rg --version
      - run: npm ci --no-fund --no-progress
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm run build
      - if: runner.os == 'macOS'
        run: npm exec -- playwright install chromium
      # Shared runners are several times slower than a developer Mac: stretch harness deadlines (ciTime), never product budgets.
      # Product latency budgets run in the latency job below instead.
      - run: npm test
        env:
          NODE_OPTIONS: --test-reporter=tap
          MOGURI_TEST_TIME_SCALE: "4"
          MOGURI_LATENCY_BUDGETS: skip
      # The packed-consumer checks start Local sessions, which are validated on macOS only (D06).
      # Their latency samples are reported here and enforced when a release runs verify:sdk.
      - if: runner.os == 'macOS'
        run: npm run verify:sdk
        env:
          MOGURI_LATENCY_BUDGETS: report
          MOGURI_LATENCY_REPORT: ${{ runner.temp }}/verify-sdk-latency.jsonl
      - if: always() && runner.os == 'macOS'
        run: node scripts/latency-report.mjs "$RUNNER_TEMP/verify-sdk-latency.jsonl"
      - if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: generated-test-evidence-${{ matrix.os }}
          path: |
            test-results/
            .moguri/artifacts/
          if-no-files-found: ignore
  # Product latency budgets are hard gates locally and in release verification. On shared runners they are measured alone here
  # and every sample is reported; a miss is a warning to investigate, never a failed main build or a reason to raise a budget.
  latency:
    name: Latency budgets (macos-15, reported)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-fund --no-progress
      - run: npm run build
      - run: npm run test:latency
        env:
          MOGURI_TEST_TIME_SCALE: "4"
          MOGURI_LATENCY_BUDGETS: report
          MOGURI_LATENCY_REPORT: ${{ runner.temp }}/latency.jsonl
      - if: always()
        run: node scripts/latency-report.mjs "$RUNNER_TEMP/latency.jsonl"
